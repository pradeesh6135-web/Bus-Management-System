```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Management - Bus Management System</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
     MAIN LAYOUT
===================================================== -->

    <div class="d-flex">


        <!-- =================================================
         SIDEBAR
    ================================================== -->

        <div class="sidebar">

            <h3 class="text-center mb-4">
                🚌 Bus Admin
            </h3>


            <a href="index.html">

                <i class="bi bi-speedometer2"></i> Dashboard

            </a>


            <a href="buses.html">

                <i class="bi bi-bus-front"></i> Buses

            </a>


            <a href="routes.html">

                <i class="bi bi-signpost-2"></i> Routes

            </a>


            <a href="drivers.html" class="active">

                <i class="bi bi-person-badge"></i> Drivers

            </a>


            <a href="schedules.html">

                <i class="bi bi-clock"></i> Schedules

            </a>


            <a href="bookings.html">

                <i class="bi bi-ticket-perforated"></i> Bookings

            </a>


            <a href="payments.html">

                <i class="bi bi-credit-card"></i> Payments

            </a>

        </div>



        <!-- =================================================
         MAIN CONTENT
    ================================================== -->

        <div class="main-content">


            <!-- =================================================
             PAGE HEADER
        ================================================== -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        <i class="bi bi-person-badge"></i> Driver Management

                    </h2>

                    <p class="text-muted mb-0">

                        Add, edit and manage bus drivers

                    </p>

                </div>


                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#driverModal" onclick="clearDriverForm()">

                <i class="bi bi-person-plus"></i>

                Add Driver

            </button>

            </div>



            <!-- =================================================
             DRIVER TABLE CARD
        ================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body">


                    <!-- SEARCH + COUNT -->

                    <div class="row mb-3">


                        <div class="col-md-7">

                            <div class="input-group">

                                <span class="input-group-text">

                                <i
                                    class="bi bi-search">
                                </i>

                            </span>


                                <input type="text" id="driverSearch" class="form-control" placeholder="Search driver, phone, license or status..." onkeyup="searchDrivers()">

                            </div>

                        </div>


                        <div class="col-md-5 text-md-end mt-2 mt-md-0">

                            <span class="badge bg-primary fs-6 p-2">

                            <i class="bi bi-people"></i>

                            Total Drivers:

                            <span id="driverCount">
                                0
                            </span>

                            </span>

                        </div>

                    </div>



                    <!-- =================================================
                     DRIVER TABLE
                ================================================== -->

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle">

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        ID
                                    </th>

                                    <th>
                                        Driver Name
                                    </th>

                                    <th>
                                        Phone
                                    </th>

                                    <th>
                                        License Number
                                    </th>

                                    <th>
                                        Experience
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Actions
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="driverTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
     ADD / EDIT DRIVER MODAL
===================================================== -->

    <div class="modal fade" id="driverModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">

                        <i class="bi bi-person-badge">
                    </i> Add / Edit Driver

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">

                </button>

                </div>



                <!-- MODAL BODY -->

                <div class="modal-body">


                    <!-- HIDDEN DRIVER ID -->

                    <input type="hidden" id="driverId">



                    <!-- DRIVER NAME -->

                    <div class="mb-3">

                        <label for="driverName" class="form-label fw-semibold">

                        Driver Name

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="driverName" class="form-control" placeholder="Enter driver name" autocomplete="off">

                    </div>



                    <!-- PHONE + LICENSE -->

                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label for="driverPhone" class="form-label fw-semibold">

                            Phone Number

                            <span class="text-danger">
                                *
                            </span>

                        </label>


                            <input type="tel" id="driverPhone" class="form-control" placeholder="9876543210" maxlength="10" autocomplete="off">

                        </div>



                        <div class="col-md-6 mb-3">

                            <label for="licenseNumber" class="form-label fw-semibold">

                            License Number

                            <span class="text-danger">
                                *
                            </span>

                        </label>


                            <input type="text" id="licenseNumber" class="form-control" placeholder="TN0120260001234" autocomplete="off">

                        </div>

                    </div>



                    <!-- EXPERIENCE -->

                    <div class="mb-3">

                        <label for="experience" class="form-label fw-semibold">

                        Experience (Years)

                    </label>


                        <input type="number" id="experience" class="form-control" placeholder="5" min="0" max="50">

                    </div>



                    <!-- STATUS -->

                    <div class="mb-3">

                        <label for="driverStatus" class="form-label fw-semibold">

                        Status

                    </label>


                        <select id="driverStatus" class="form-select">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                        <option value="On Leave">
                            On Leave
                        </option>

                    </select>

                    </div>


                </div>



                <!-- =================================================
                 MODAL FOOTER
            ================================================== -->

                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    <i
                        class="bi bi-x-circle">
                    </i>

                    Cancel

                </button>


                    <button type="button" class="btn btn-primary" onclick="saveDriver()">

                    <i
                        class="bi bi-check-circle">
                    </i>

                    Save Driver

                </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
     APP JS
===================================================== -->

    <script src="js/app.js">
    </script>



    <!-- =====================================================
     DRIVER COUNT
===================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updateDriverCount();

            }
        );


        function updateDriverCount() {

            const countElement =
                document.getElementById(
                    "driverCount"
                );


            if (!countElement) {

                return;

            }


            try {

                const drivers =
                    JSON.parse(
                        localStorage.getItem(
                            "drivers"
                        )
                    ) || [];


                countElement.textContent =
                    Array.isArray(drivers) ?
                    drivers.length :
                    0;

            } catch (error) {

                console.error(
                    "Driver count error:",
                    error
                );

                countElement.textContent =
                    "0";

            }

        }
    </script>


</body>

</html>
```

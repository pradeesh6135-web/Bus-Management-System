<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule Management - Bus Management System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
     MAIN LAYOUT
===================================================== -->

    <div class="d-flex">


        <!-- =================================================
         SIDEBAR
    ================================================== -->

        <div class="sidebar">

            <h3 class="text-center mb-4">
                🚌 Bus Admin
            </h3>


            <a href="index.html">

                <i class="bi bi-speedometer2"></i> Dashboard

            </a>


            <a href="buses.html">

                <i class="bi bi-bus-front"></i> Buses

            </a>


            <a href="routes.html">

                <i class="bi bi-signpost-2"></i> Routes

            </a>


            <a href="drivers.html">

                <i class="bi bi-person-badge"></i> Drivers

            </a>


            <a href="schedules.html" class="active">

                <i class="bi bi-clock"></i> Schedules

            </a>


            <a href="bookings.html">

                <i class="bi bi-ticket-perforated"></i> Bookings

            </a>


            <a href="payments.html">

                <i class="bi bi-credit-card"></i> Payments

            </a>

        </div>



        <!-- =================================================
         MAIN CONTENT
    ================================================== -->

        <div class="main-content">


            <!-- PAGE HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        <i class="bi bi-clock"></i> Schedule Management

                    </h2>

                    <p class="text-muted mb-0">

                        Manage bus schedules and departure timings

                    </p>

                </div>


                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#scheduleModal" onclick="clearScheduleForm()">

                <i class="bi bi-plus-circle"></i>

                Add Schedule

            </button>

            </div>



            <!-- =================================================
             SCHEDULE TABLE
        ================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body">


                    <!-- SEARCH -->

                    <div class="row mb-3">

                        <div class="col-md-7">

                            <div class="input-group">

                                <span class="input-group-text">

                                <i class="bi bi-search"></i>

                            </span>


                                <input type="text" id="scheduleSearch" class="form-control" placeholder="Search bus, route, date, time..." onkeyup="searchSchedules()">

                            </div>

                        </div>


                        <div class="col-md-5 text-md-end mt-2 mt-md-0">

                            <span class="badge bg-primary fs-6 p-2">

                            <i class="bi bi-clock"></i>

                            Total Schedules:

                            <span id="scheduleCount">
                                0
                            </span>

                            </span>

                        </div>

                    </div>



                    <!-- TABLE -->

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle">

                            <thead class="table-dark">

                                <tr>

                                    <th>ID</th>

                                    <th>Bus</th>

                                    <th>Route</th>

                                    <th>Departure</th>

                                    <th>Arrival</th>

                                    <th>Date</th>

                                    <th>Status</th>

                                    <th>Actions</th>

                                </tr>

                            </thead>


                            <tbody id="scheduleTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
     ADD / EDIT SCHEDULE MODAL
===================================================== -->

    <div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">

                        <i class="bi bi-clock"></i> Add / Edit Schedule

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">

                </button>

                </div>



                <!-- MODAL BODY -->

                <div class="modal-body">


                    <!-- Hidden ID -->

                    <input type="hidden" id="scheduleId">



                    <!-- BUS -->

                    <div class="mb-3">

                        <label for="scheduleBus" class="form-label fw-semibold">

                        Bus

                        <span class="text-danger">*</span>

                    </label>


                        <input type="text" id="scheduleBus" class="form-control" placeholder="TN-01-AB-1234" autocomplete="off">

                    </div>



                    <!-- ROUTE -->

                    <div class="mb-3">

                        <label for="scheduleRoute" class="form-label fw-semibold">

                        Route

                        <span class="text-danger">*</span>

                    </label>


                        <input type="text" id="scheduleRoute" class="form-control" placeholder="Chennai - Pondicherry" autocomplete="off">

                    </div>



                    <!-- DEPARTURE + ARRIVAL -->

                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label for="departureTime" class="form-label fw-semibold">

                            Departure Time

                            <span class="text-danger">*</span>

                        </label>


                            <input type="time" id="departureTime" class="form-control">

                        </div>



                        <div class="col-md-6 mb-3">

                            <label for="arrivalTime" class="form-label fw-semibold">

                            Arrival Time

                            <span class="text-danger">*</span>

                        </label>


                            <input type="time" id="arrivalTime" class="form-control">

                        </div>

                    </div>



                    <!-- DATE -->

                    <div class="mb-3">

                        <label for="scheduleDate" class="form-label fw-semibold">

                        Travel Date

                    </label>


                        <input type="date" id="scheduleDate" class="form-control">

                    </div>



                    <!-- STATUS -->

                    <div class="mb-3">

                        <label for="scheduleStatus" class="form-label fw-semibold">

                        Status

                    </label>


                        <select id="scheduleStatus" class="form-select">

                        <option value="Scheduled">
                            Scheduled
                        </option>

                        <option value="Running">
                            Running
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                    </div>


                </div>



                <!-- MODAL FOOTER -->

                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    <i class="bi bi-x-circle"></i>

                    Cancel

                </button>


                    <button type="button" class="btn btn-primary" onclick="saveSchedule()">

                    <i class="bi bi-check-circle"></i>

                    Save Schedule

                </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
     APP JS
===================================================== -->

    <script src="js/app.js">
    </script>



    <!-- =====================================================
     SCHEDULE COUNT
===================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updateScheduleCount();

            }
        );


        function updateScheduleCount() {

            const countElement =
                document.getElementById(
                    "scheduleCount"
                );


            if (!countElement) {

                return;

            }


            try {

                const schedules =
                    JSON.parse(
                        localStorage.getItem(
                            "schedules"
                        )
                    ) || [];


                countElement.textContent =
                    Array.isArray(schedules) ?
                    schedules.length :
                    0;

            } catch (error) {

                console.error(
                    "Schedule count error:",
                    error
                );

                countElement.textContent = "0";

            }

        }
    </script>


</body>

</html>

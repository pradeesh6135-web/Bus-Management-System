<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management - Bus Management System</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
     MAIN LAYOUT
===================================================== -->

    <div class="d-flex">


        <!-- =================================================
         SIDEBAR
    ================================================== -->

        <div class="sidebar">

            <h3 class="text-center mb-4">
                🚌 Bus Admin
            </h3>


            <a href="index.html">

                <i class="bi bi-speedometer2"></i> Dashboard

            </a>


            <a href="buses.html">

                <i class="bi bi-bus-front"></i> Buses

            </a>


            <a href="routes.html">

                <i class="bi bi-signpost-2"></i> Routes

            </a>


            <a href="drivers.html">

                <i class="bi bi-person-badge"></i> Drivers

            </a>


            <a href="schedules.html">

                <i class="bi bi-clock"></i> Schedules

            </a>


            <a href="bookings.html">

                <i class="bi bi-ticket-perforated"></i> Bookings

            </a>


            <a href="payments.html" class="active">

                <i class="bi bi-credit-card"></i> Payments

            </a>

        </div>



        <!-- =================================================
         MAIN CONTENT
    ================================================== -->

        <div class="main-content">


            <!-- =================================================
             PAGE HEADER
        ================================================== -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        <i class="bi bi-credit-card"></i> Payment Management

                    </h2>

                    <p class="text-muted mb-0">

                        Manage booking payments and transactions

                    </p>

                </div>


                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal" onclick="clearPaymentForm()">

                <i class="bi bi-plus-circle"></i>

                Add Payment

            </button>

            </div>



            <!-- =================================================
             PAYMENT TABLE CARD
        ================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body">


                    <!-- SEARCH + COUNT -->

                    <div class="row mb-3">


                        <div class="col-md-7">

                            <div class="input-group">

                                <span class="input-group-text">

                                <i
                                    class="bi bi-search">
                                </i>

                            </span>


                                <input type="text" id="paymentSearch" class="form-control" placeholder="Search payment, booking, passenger or method..." onkeyup="searchPayments()">

                            </div>

                        </div>


                        <div class="col-md-5 text-md-end mt-2 mt-md-0">

                            <span class="badge bg-primary fs-6 p-2">

                            <i class="bi bi-credit-card"></i>

                            Total Payments:

                            <span id="paymentCount">
                                0
                            </span>

                            </span>

                        </div>

                    </div>



                    <!-- =================================================
                     PAYMENT TABLE
                ================================================== -->

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle">

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        ID
                                    </th>

                                    <th>
                                        Booking ID
                                    </th>

                                    <th>
                                        Passenger
                                    </th>

                                    <th>
                                        Amount
                                    </th>

                                    <th>
                                        Payment Method
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Actions
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="paymentTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
     ADD / EDIT PAYMENT MODAL
===================================================== -->

    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">

                        <i class="bi bi-credit-card">
                    </i> Add / Edit Payment

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">

                </button>

                </div>



                <!-- =================================================
                 MODAL BODY
            ================================================== -->

                <div class="modal-body">


                    <!-- HIDDEN PAYMENT ID -->

                    <input type="hidden" id="paymentId">



                    <!-- BOOKING ID -->

                    <div class="mb-3">

                        <label for="paymentBooking" class="form-label fw-semibold">

                        Booking ID

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="paymentBooking" class="form-control" placeholder="Enter Booking ID" autocomplete="off">

                    </div>



                    <!-- PASSENGER -->

                    <div class="mb-3">

                        <label for="paymentPassenger" class="form-label fw-semibold">

                        Passenger Name

                    </label>


                        <input type="text" id="paymentPassenger" class="form-control" placeholder="Enter passenger name" autocomplete="off">

                    </div>



                    <!-- AMOUNT -->

                    <div class="mb-3">

                        <label for="amount" class="form-label fw-semibold">

                        Amount

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <div class="input-group">

                            <span class="input-group-text">

                            ₹

                        </span>


                            <input type="number" id="amount" class="form-control" placeholder="450" min="1" step="0.01">

                        </div>

                    </div>



                    <!-- PAYMENT METHOD -->

                    <div class="mb-3">

                        <label for="paymentMethod" class="form-label fw-semibold">

                        Payment Method

                    </label>


                        <select id="paymentMethod" class="form-select">

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                        <option value="Debit Card">
                            Debit Card
                        </option>

                        <option value="Net Banking">
                            Net Banking
                        </option>

                    </select>

                    </div>



                    <!-- PAYMENT STATUS -->

                    <div class="mb-3">

                        <label for="paymentStatus" class="form-label fw-semibold">

                        Payment Status

                    </label>


                        <select id="paymentStatus" class="form-select">

                        <option value="Paid">
                            Paid
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Refunded">
                            Refunded
                        </option>

                        <option value="Failed">
                            Failed
                        </option>

                    </select>

                    </div>


                </div>



                <!-- =================================================
                 MODAL FOOTER
            ================================================== -->

                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    <i
                        class="bi bi-x-circle">
                    </i>

                    Cancel

                </button>


                    <button type="button" class="btn btn-primary" onclick="savePayment()">

                    <i
                        class="bi bi-check-circle">
                    </i>

                    Save Payment

                </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
     PAYMENT JS
===================================================== -->

    <script src="js/payments.js">
    </script>



    <!-- =====================================================
     PAYMENT COUNT
===================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updatePaymentCount();

            }
        );


        function updatePaymentCount() {

            const countElement =
                document.getElementById(
                    "paymentCount"
                );


            if (!countElement) {

                return;

            }


            try {

                const payments =
                    JSON.parse(
                        localStorage.getItem(
                            "payments"
                        )
                    ) || [];


                countElement.textContent =
                    Array.isArray(payments) ?
                    payments.length :
                    0;

            } catch (error) {

                console.error(
                    "Payment count error:",
                    error
                );

                countElement.textContent =
                    "0";

            }

        }
    </script>


</body>

</html>

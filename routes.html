```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Route Management - Bus Management System</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
     MAIN LAYOUT
===================================================== -->

    <div class="d-flex">


        <!-- =================================================
         SIDEBAR
    ================================================== -->

        <div class="sidebar">

            <h3 class="text-center mb-4">
                🚌 Bus Admin
            </h3>


            <a href="index.html">

                <i class="bi bi-speedometer2"></i> Dashboard

            </a>


            <a href="buses.html">

                <i class="bi bi-bus-front"></i> Buses

            </a>


            <a href="routes.html" class="active">

                <i class="bi bi-signpost-2"></i> Routes

            </a>


            <a href="drivers.html">

                <i class="bi bi-person-badge"></i> Drivers

            </a>


            <a href="schedules.html">

                <i class="bi bi-clock"></i> Schedules

            </a>


            <a href="bookings.html">

                <i class="bi bi-ticket-perforated"></i> Bookings

            </a>


            <a href="payments.html">

                <i class="bi bi-credit-card"></i> Payments

            </a>

        </div>



        <!-- =================================================
         MAIN CONTENT
    ================================================== -->

        <div class="main-content">


            <!-- =================================================
             PAGE HEADER
        ================================================== -->

            <div class="d-flex justify-content-between align-items-center mb-4">


                <div>

                    <h2 class="fw-bold">

                        <i class="bi bi-signpost-2"></i> Route Management

                    </h2>


                    <p class="text-muted mb-0">

                        Add, edit, search and manage bus routes

                    </p>

                </div>


                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#routeModal" onclick="clearRouteForm()">

                <i class="bi bi-plus-circle"></i>

                Add Route

            </button>

            </div>



            <!-- =================================================
             ROUTE TABLE CARD
        ================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body">


                    <!-- SEARCH + COUNT -->

                    <div class="row mb-3">


                        <div class="col-md-7">

                            <div class="input-group">

                                <span class="input-group-text">

                                <i
                                    class="bi bi-search">
                                </i>

                            </span>


                                <input type="text" id="routeSearch" class="form-control" placeholder="Search route, start point, destination..." onkeyup="searchRoutes()">

                            </div>

                        </div>


                        <div class="col-md-5 text-md-end mt-2 mt-md-0">

                            <span class="badge bg-primary fs-6 p-2">

                            <i class="bi bi-signpost-2"></i>

                            Total Routes:

                            <span id="routeCount">
                                0
                            </span>

                            </span>

                        </div>

                    </div>



                    <!-- =================================================
                     ROUTE TABLE
                ================================================== -->

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle">

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        ID
                                    </th>

                                    <th>
                                        Route
                                    </th>

                                    <th>
                                        Starting Point
                                    </th>

                                    <th>
                                        Destination
                                    </th>

                                    <th>
                                        Distance
                                    </th>

                                    <th>
                                        Fare
                                    </th>

                                    <th>
                                        Actions
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="routeTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
     ADD / EDIT ROUTE MODAL
===================================================== -->

    <div class="modal fade" id="routeModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">

                        <i class="bi bi-signpost-2"></i> Add / Edit Route

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">

                </button>

                </div>



                <!-- =================================================
                 MODAL BODY
            ================================================== -->

                <div class="modal-body">


                    <!-- HIDDEN ROUTE ID -->

                    <input type="hidden" id="routeId">



                    <!-- ROUTE NAME -->

                    <div class="mb-3">

                        <label for="routeName" class="form-label fw-semibold">

                        Route Name

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="routeName" class="form-control" placeholder="Chennai - Pondicherry" autocomplete="off">

                    </div>



                    <!-- START POINT -->

                    <div class="mb-3">

                        <label for="startPoint" class="form-label fw-semibold">

                        Starting Point

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="startPoint" class="form-control" placeholder="Chennai" autocomplete="off">

                    </div>



                    <!-- DESTINATION -->

                    <div class="mb-3">

                        <label for="destination" class="form-label fw-semibold">

                        Destination

                        <span class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="destination" class="form-control" placeholder="Pondicherry" autocomplete="off">

                    </div>



                    <!-- DISTANCE -->

                    <div class="mb-3">

                        <label for="distance" class="form-label fw-semibold">

                        Distance (KM)

                    </label>


                        <div class="input-group">

                            <input type="number" id="distance" class="form-control" placeholder="150" min="0" step="0.1">

                            <span class="input-group-text">

                            KM

                        </span>

                        </div>

                    </div>



                    <!-- FARE -->

                    <div class="mb-3">

                        <label for="fare" class="form-label fw-semibold">

                        Fare

                    </label>


                        <div class="input-group">

                            <span class="input-group-text">

                            ₹

                        </span>


                            <input type="number" id="fare" class="form-control" placeholder="250" min="0" step="0.01">

                        </div>

                    </div>


                </div>



                <!-- =================================================
                 MODAL FOOTER
            ================================================== -->

                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    <i
                        class="bi bi-x-circle">
                    </i>

                    Cancel

                </button>


                    <button type="button" class="btn btn-primary" onclick="saveRoute()">

                    <i
                        class="bi bi-check-circle">
                    </i>

                    Save Route

                </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
     APP JS
===================================================== -->

    <script src="js/app.js">
    </script>



    <!-- =====================================================
     ROUTE COUNT
===================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updateRouteCount();

            }
        );


        function updateRouteCount() {

            const countElement =
                document.getElementById(
                    "routeCount"
                );


            if (!countElement) {

                return;

            }


            try {

                const routes =
                    JSON.parse(
                        localStorage.getItem(
                            "routes"
                        )
                    ) || [];


                countElement.textContent =
                    Array.isArray(routes) ?
                    routes.length :
                    0;

            } catch (error) {

                console.error(
                    "Route count error:",
                    error
                );

                countElement.textContent =
                    "0";

            }

        }
    </script>


</body>

</html>
```

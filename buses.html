<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Management - Bus Management System</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Project CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
     MAIN LAYOUT
===================================================== -->

    <div class="d-flex">


        <!-- =================================================
         SIDEBAR
    ================================================== -->

        <div class="sidebar">

            <h3 class="text-center mb-4">
                🚌 Bus Admin
            </h3>


            <a href="index.html">

                <i class="bi bi-speedometer2"></i> Dashboard

            </a>


            <a href="buses.html" class="active">

                <i class="bi bi-bus-front"></i> Buses

            </a>


            <a href="routes.html">

                <i class="bi bi-signpost-2"></i> Routes

            </a>


            <a href="drivers.html">

                <i class="bi bi-person-badge"></i> Drivers

            </a>


            <a href="schedules.html">

                <i class="bi bi-clock"></i> Schedules

            </a>


            <a href="bookings.html">

                <i class="bi bi-ticket-perforated"></i> Bookings

            </a>


            <a href="payments.html">

                <i class="bi bi-credit-card"></i> Payments

            </a>

        </div>



        <!-- =================================================
         MAIN CONTENT
    ================================================== -->

        <div class="main-content">


            <!-- =================================================
             HEADER
        ================================================== -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        <i class="bi bi-bus-front"></i> Bus Management

                    </h2>

                    <p class="text-muted mb-0">

                        Add, edit, search and manage buses

                    </p>

                </div>


                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#busModal" onclick="clearBusForm()">

                <i class="bi bi-plus-circle"></i>

                Add Bus

            </button>

            </div>



            <!-- =================================================
             BUS TABLE CARD
        ================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body">


                    <!-- SEARCH + COUNT -->

                    <div class="row mb-3">


                        <div class="col-md-7">

                            <div class="input-group">

                                <span class="input-group-text">

                                <i
                                    class="bi bi-search">
                                </i>

                            </span>


                                <input type="text" id="busSearch" class="form-control" placeholder="Search bus number, type, driver or status..." onkeyup="searchBuses()">

                            </div>

                        </div>


                        <div class="col-md-5 text-md-end mt-2 mt-md-0">

                            <span class="badge bg-primary fs-6 p-2">

                            <i class="bi bi-bus-front"></i>

                            Total Buses:

                            <span id="busCount">
                                0
                            </span>

                            </span>

                        </div>

                    </div>



                    <!-- =================================================
                     TABLE
                ================================================== -->

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle">

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        ID
                                    </th>

                                    <th>
                                        Bus Number
                                    </th>

                                    <th>
                                        Bus Type
                                    </th>

                                    <th>
                                        Capacity
                                    </th>

                                    <th>
                                        Driver
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Actions
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="busTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
     ADD / EDIT BUS MODAL
===================================================== -->

    <div class="modal fade" id="busModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">

                        <i class="bi bi-bus-front"></i> Add / Edit Bus

                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">

                </button>

                </div>



                <!-- MODAL BODY -->

                <div class="modal-body">


                    <!-- HIDDEN BUS ID -->

                    <input type="hidden" id="busId">



                    <!-- BUS NUMBER -->

                    <div class="mb-3">

                        <label for="busNumber" class="form-label fw-semibold">

                        Bus Number

                        <span
                            class="text-danger">
                            *
                        </span>

                    </label>


                        <input type="text" id="busNumber" class="form-control" placeholder="TN-01-AB-1234" autocomplete="off">

                    </div>



                    <!-- BUS TYPE -->

                    <div class="mb-3">

                        <label for="busType" class="form-label fw-semibold">

                        Bus Type

                    </label>


                        <select id="busType" class="form-select">

                        <option value="AC">
                            AC
                        </option>

                        <option value="Non-AC">
                            Non-AC
                        </option>

                        <option value="Volvo">
                            Volvo
                        </option>

                        <option value="Electric">
                            Electric
                        </option>

                    </select>

                    </div>



                    <!-- CAPACITY -->

                    <div class="mb-3">

                        <label for="capacity" class="form-label fw-semibold">

                        Capacity

                    </label>


                        <input type="number" id="capacity" class="form-control" placeholder="50" min="1">

                    </div>



                    <!-- DRIVER -->

                    <div class="mb-3">

                        <label for="driver" class="form-label fw-semibold">

                        Driver Name

                    </label>


                        <input type="text" id="driver" class="form-control" placeholder="Enter driver name" autocomplete="off">

                    </div>



                    <!-- STATUS -->

                    <div class="mb-3">

                        <label for="busStatus" class="form-label fw-semibold">

                        Status

                    </label>


                        <select id="busStatus" class="form-select">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                    </select>

                    </div>


                </div>



                <!-- MODAL FOOTER -->

                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    <i
                        class="bi bi-x-circle">
                    </i>

                    Cancel

                </button>


                    <button type="button" class="btn btn-primary" onclick="saveBus()">

                    <i
                        class="bi bi-check-circle">
                    </i>

                    Save Bus

                </button>

                </div>


            </div>

        </div>

    </div>



    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
     APP JS
===================================================== -->

    <script src="js/app.js">
    </script>



    <!-- =====================================================
     BUS COUNT
===================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function() {

                updateBusCount();

            }
        );


        function updateBusCount() {

            const countElement =
                document.getElementById(
                    "busCount"
                );


            if (!countElement) {

                return;

            }


            try {

                const buses =
                    JSON.parse(
                        localStorage.getItem(
                            "buses"
                        )
                    ) || [];


                countElement.textContent =
                    Array.isArray(buses) ?
                    buses.length :
                    0;

            } catch (error) {

                console.error(
                    "Bus count error:",
                    error
                );

                countElement.textContent =
                    "0";

            }

        }
    </script>


</body>

</html>
